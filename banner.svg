<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="昱满天下 jzszlxx 认知觉醒能量站">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2EA"/>
      <stop offset="0.55" stop-color="#F2EADD"/>
      <stop offset="1" stop-color="#E7DCCB"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A89781"/>
      <stop offset="1" stop-color="#8E7E68"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="12" height="320" fill="#2E2A26"/>
  <rect x="0" y="314" width="1200" height="6" fill="#2E2A26"/>

  <!-- 右侧装饰：同心圆 -->
  <circle cx="1010" cy="160" r="196" fill="#FFFFFF" opacity="0.34"/>
  <circle cx="1010" cy="160" r="150" fill="#FFFFFF" opacity="0.34"/>

  <!-- 猫 -->
  <g transform="translate(1010 168)">
