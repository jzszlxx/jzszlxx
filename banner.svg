    <path d="M-96 -46 L-60 -132 L-12 -50 Z" fill="url(#fur)"/>
    <path d="M-72 -54 L-60 -104 L-28 -56 Z" fill="#D9A6A0"/>
    <path d="M96 -46 L60 -132 L12 -50 Z" fill="url(#fur)"/>
    <path d="M72 -54 L60 -104 L28 -56 Z" fill="#D9A6A0"/>
    <!-- 头 -->
