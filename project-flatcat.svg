<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="FlatCat 项目卡片">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F1"/>
      <stop offset="1" stop-color="#F1E8DA"/>
    </linearGradient>
    <linearGradient id="fur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AA9983"/>
      <stop offset="1" stop-color="#8B7A64"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#cardbg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#DDD0BE" stroke-width="2"/>
  <rect x="0" y="0" width="8" height="320" fill="#C4563F"/>

  <!-- 左侧：猫坐键盘 -->
  <g transform="translate(150 166) scale(0.96)">
    <ellipse cx="0" cy="96" rx="104" ry="12" fill="#2E2A26" opacity="0.10"/>
    <!-- 尾巴 -->
    <path d="M62 62 C96 52 118 30 112 -6" fill="none" stroke="#9C8D7A" stroke-width="15" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M0 -34 C-52 -34 -78 2 -78 46 C-78 88 -46 106 0 106 C46 106 78 88 78 46 C78 2 52 -34 0 -34 Z" fill="url(#fur2)"/>
    <!-- 前腿 -->
    <rect x="-46" y="58" width="34" height="54" rx="16" fill="#9C8D7A"/>
    <rect x="14" y="58" width="34" height="54" rx="16" fill="#9C8D7A"/>
    <ellipse cx="-29" cy="112" rx="23" ry="12" fill="#F3EEE5"/>
    <ellipse cx="31" cy="112" rx="23" ry="12" fill="#F3EEE5"/>
    <!-- 键盘 -->
    <rect x="-96" y="112" width="192" height="34" rx="7" fill="#2E2A26"/>
    <g fill="#D8CDB6">
      <rect x="-88" y="118" width="12" height="7" rx="2"/><rect x="-73" y="118" width="12" height="7" rx="2"/>
      <rect x="-58" y="118" width="12" height="7" rx="2"/><rect x="-43" y="118" width="12" height="7" rx="2"/>
      <rect x="-28" y="118" width="12" height="7" rx="2"/><rect x="-13" y="118" width="12" height="7" rx="2"/>
      <rect x="2" y="118" width="12" height="7" rx="2"/><rect x="17" y="118" width="12" height="7" rx="2"/>
      <rect x="32" y="118" width="12" height="7" rx="2"/><rect x="47" y="118" width="12" height="7" rx="2"/>
      <rect x="62" y="118" width="12" height="7" rx="2"/><rect x="77" y="118" width="12" height="7" rx="2"/>
      <rect x="-88" y="130" width="12" height="7" rx="2"/><rect x="-73" y="130" width="12" height="7" rx="2"/>
      <rect x="-58" y="130" width="12" height="7" rx="2"/><rect x="-43" y="130" width="12" height="7" rx="2"/>
      <rect x="-28" y="130" width="12" height="7" rx="2"/><rect x="-13" y="130" width="12" height="7" rx="2"/>
      <rect x="2" y="130" width="12" height="7" rx="2"/><rect x="17" y="130" width="12" height="7" rx="2"/>
      <rect x="32" y="130" width="12" height="7" rx="2"/><rect x="47" y="130" width="12" height="7" rx="2"/>
      <rect x="62" y="130" width="12" height="7" rx="2"/><rect x="77" y="130" width="12" height="7" rx="2"/>
    </g>
    <!-- 耳朵 -->
    <path d="M-74 -104 L-46 -158 L-16 -108 Z" fill="url(#fur2)"/>
    <path d="M-64 -108 L-46 -144 L-26 -110 Z" fill="#D9A6A0"/>
    <path d="M74 -104 L46 -158 L16 -108 Z" fill="url(#fur2)"/>
    <path d="M64 -108 L46 -144 L26 -110 Z" fill="#D9A6A0"/>
    <!-- 头 -->
    <ellipse cx="0" cy="-62" rx="76" ry="70" fill="url(#fur2)"/>
    <g stroke="#6B5C49" stroke-width="6" stroke-linecap="round">
      <line x1="-16" y1="-118" x2="-16" y2="-96"/>
      <line x1="0" y1="-124" x2="0" y2="-98"/>
      <line x1="16" y1="-118" x2="16" y2="-96"/>
    </g>
    <ellipse cx="0" cy="-38" rx="34" ry="25" fill="#F3EEE5"/>
    <ellipse cx="-30" cy="-64" rx="14" ry="18" fill="#7BB93F"/>
    <ellipse cx="30" cy="-64" rx="14" ry="18" fill="#7BB93F"/>
    <ellipse cx="-30" cy="-64" rx="5" ry="10" fill="#221F1C"/>
    <ellipse cx="30" cy="-64" rx="5" ry="10" fill="#221F1C"/>
    <circle cx="-34" cy="-72" r="4" fill="#FAFDF5"/>
    <circle cx="26" cy="-72" r="4" fill="#FAFDF5"/>
    <path d="M-6 -44 L6 -44 L0 -37 Z" fill="#D9A6A0"/>
    <g stroke="#221F1C" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="-40" y1="-40" x2="-70" y2="-46"/>
      <line x1="-40" y1="-33" x2="-72" y2="-30"/>
      <line x1="40" y1="-40" x2="70" y2="-46"/>
      <line x1="40" y1="-33" x2="72" y2="-30"/>
    </g>
  </g>

  <!-- 右侧文字 -->
  <text x="330" y="86" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#262220">FlatCat</text>
  <text x="330" y="122" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20" fill="#8E8071">2D 扁平桌面宠物 · C# + WinForms · 单文件 exe</text>

  <rect x="330" y="140" width="56" height="3" fill="#C4563F"/>

  <text x="330" y="172" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#3A342E">透明置顶，点猫才响应，其余区域穿透给桌面</text>
  <text x="330" y="202" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#3A342E">任意程序打字都会抬爪，摸头呼噜，按住能拖走</text>
  <text x="330" y="232" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#3A342E">番茄钟 / 喝水 / 倒计时 / 多组闹钟 · 四页设置窗口</text>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14">
    <rect x="330" y="252" width="84" height="24" rx="12" fill="#FFFFFF" stroke="#D3C6B6" stroke-width="1.4"/>
    <text x="372" y="268" text-anchor="middle" fill="#5A4F44">透明置顶</text>
    <rect x="424" y="252" width="84" height="24" rx="12" fill="#FFFFFF" stroke="#D3C6B6" stroke-width="1.4"/>
    <text x="466" y="268" text-anchor="middle" fill="#5A4F44">点击穿透</text>
    <rect x="518" y="252" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#D3C6B6" stroke-width="1.4"/>
    <text x="553" y="268" text-anchor="middle" fill="#5A4F44">全局钩子</text>
    <rect x="598" y="252" width="106" height="24" rx="12" fill="#C4563F"/>
    <text x="651" y="268" text-anchor="middle" fill="#FFFFFF">v1.3.0 已发布</text>
  </g>
</svg>